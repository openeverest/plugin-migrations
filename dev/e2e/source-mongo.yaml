# Stand-in for an "external" MongoDB: a single-node replica set (PCSM needs
# change streams, which require a replica set). Data lives in an emptyDir.
apiVersion: v1
kind: Namespace
metadata:
  name: legacy
---
apiVersion: v1
kind: Service
metadata:
  name: source-mongo
  namespace: legacy
spec:
  clusterIP: None
  selector:
    app: source-mongo
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: source-mongo
  namespace: legacy
spec:
  serviceName: source-mongo
  replicas: 1
  selector:
    matchLabels:
      app: source-mongo
  template:
    metadata:
      labels:
        app: source-mongo
    spec:
      containers:
        - name: mongod
          image: mongo:7.0
          args: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
