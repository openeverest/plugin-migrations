{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: the per-target migration check is serialized in one backend process" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-migrations.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "plugin-migrations.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plugin-migrations.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugin-migrations.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plugin-migrations.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKLOAD_NAMESPACE
              value: {{ include "plugin-migrations.workloadNamespace" . | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
            - name: ENGINES
              value: {{ .Values.engines | toJson | quote }}
            - name: WORKER_RESOURCES
              value: {{ .Values.worker.resources | toJson | quote }}
            - name: WORKER_NODE_SELECTOR
              value: {{ .Values.worker.nodeSelector | toJson | quote }}
            - name: WORKER_TOLERATIONS
              value: {{ .Values.worker.tolerations | toJson | quote }}
            - name: WORKER_IMAGE_PULL_SECRETS
              value: {{ .Values.worker.imagePullSecrets | toJson | quote }}
            - name: WORKER_STORAGE_CLASS_NAME
              value: {{ .Values.worker.storageClassName | default "" | quote }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
