# Must stay 1: the one-active-migration-per-target check is serialized inside
# the backend process. Migration state itself lives in Kubernetes objects.
replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-migrations
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

plugin:
  displayName: "Migrations"
  description: "Migrate databases into OpenEverest with full load and change data capture."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  icon: "/icon.svg"
  extensionPoints:
    - type: route
      path: /migrations
      label: Migrations
    - type: sidebarItem
      label: Migrations
      icon: "/icon.svg"

# OpenEverest API URL. Empty auto-discovers the in-cluster "everest" Service.
everestAPIURL: ""

# Namespace holding migration records (ConfigMaps) and their workers
# (Deployment, Service, Secret). Empty uses the release namespace.
workload:
  namespace: ""
  # Set to true only when Helm may create the configured workload namespace.
  createNamespace: false

# How often the backend refreshes worker status and starts new migrations.
reconcileInterval: 5s

# Compiled-in migration engines and their worker images. At least one engine
# must be enabled. Disabling an engine leaves its existing workers running but
# makes them unmanageable from the UI until it is re-enabled.
engines:
  pcsm:
    enabled: true
    image:
      repository: percona/percona-clustersync-mongodb
      tag: "1.0.0"
      pullPolicy: IfNotPresent
  # PostgreSQL → PostgreSQL with native logical replication (publication on
  # the source, subscription on the target). The worker image only drives it:
  # see workers/postgres-logical. Released together with the plugin.
  postgres-logical:
    enabled: true
    image:
      repository: ghcr.io/openeverest/plugin-migrations-postgres-logical
      tag: "0.1.0"
      pullPolicy: IfNotPresent
  # MySQL → MySQL (PXC targets) with native GTID replication: MySQL Shell
  # copies the databases, then the target replicates from the source. The
  # worker image only drives it: see workers/mysql-replication. Released
  # together with the plugin.
  mysql-replication:
    enabled: true
    image:
      repository: ghcr.io/openeverest/plugin-migrations-mysql-replication
      tag: "0.1.0"
      pullPolicy: IfNotPresent
  # MariaDB → MariaDB (standalone and Galera targets of provider-mariadb
  # 0.2.2+) with native GTID replication: mydumper/myloader copy the
  # databases, then the target replicates from the source. Same worker image
  # as mysql-replication.
  mariadb-replication:
    enabled: true
    image:
      repository: ghcr.io/openeverest/plugin-migrations-mysql-replication
      tag: "0.1.0"
      pullPolicy: IfNotPresent
  # Redis or Valkey → Valkey (provider-valkey targets) with RedisShake: a
  # snapshot through the replication protocol, then ongoing changes. The
  # worker image bundles RedisShake: see workers/redis-shake. Released
  # together with the plugin.
  redis-shake:
    enabled: true
    image:
      repository: ghcr.io/openeverest/plugin-migrations-redis-shake
      tag: "0.1.0"
      pullPolicy: IfNotPresent
  # SQL Server → SQL Server (provider-mssql targets) with log shipping
  # through an OpenEverest BackupStorage: the servers back up to and restore
  # from S3 themselves; see workers/mssql-log-shipping. Released together with
  # the plugin. Enabling it grants the backend read access to Secrets in
  # every namespace, to read the chosen BackupStorage's credentials.
  mssql-log-shipping:
    enabled: true
    image:
      repository: ghcr.io/openeverest/plugin-migrations-mssql-log-shipping
      tag: "0.1.0"
      pullPolicy: IfNotPresent

# Applied to every migration worker.
worker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  # Storage class of the volumes some workers keep data on (tidb-dm: the
  # dump and DM's state). Empty uses the cluster's default class.
  storageClassName: ""
