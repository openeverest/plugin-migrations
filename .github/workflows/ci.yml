name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: type-check + build
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + vite build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm test

  # ──────────────────────────────────────────────────────────────────────────
  # Backend: go vet + build
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (gofmt + vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: cd backend && go mod download

      - name: Vet
        run: cd backend && go vet ./...

      - name: Format
        run: test -z "$(cd backend && gofmt -l .)"

      - name: Test
        run: cd backend && go test -race ./...

      - name: Build
        run: cd backend && go build -o /dev/null .

  # ──────────────────────────────────────────────────────────────────────────
  # postgres-logical worker agent: vet + test + image build
  # ──────────────────────────────────────────────────────────────────────────
  postgres-logical-worker:
    name: postgres-logical worker (gofmt + vet + test + image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - name: Vet
        run: cd workers/postgres-logical && go vet ./...

      - name: Format
        run: test -z "$(cd workers/postgres-logical && gofmt -l .)"

      - name: Test
        run: cd workers/postgres-logical && go test -race ./...

      - name: Build image
        run: docker build -t plugin-migrations-postgres-logical:ci workers/postgres-logical

  # ──────────────────────────────────────────────────────────────────────────
  # mysql-replication worker agent: vet + test + image build
  # ──────────────────────────────────────────────────────────────────────────
  mysql-replication-worker:
    name: mysql-replication worker (gofmt + vet + test + image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - name: Vet
        run: cd workers/mysql-replication && go vet ./...

      - name: Format
        run: test -z "$(cd workers/mysql-replication && gofmt -l .)"

      - name: Test
        run: cd workers/mysql-replication && go test -race ./...

      - name: Build image
        run: docker build -t plugin-migrations-mysql-replication:ci workers/mysql-replication

  # ──────────────────────────────────────────────────────────────────────────
  # redis-shake worker agent: vet + test + image build
  # ──────────────────────────────────────────────────────────────────────────
  redis-shake-worker:
    name: redis-shake worker (gofmt + vet + test + image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - name: Vet
        run: cd workers/redis-shake && go vet ./...

      - name: Format
        run: test -z "$(cd workers/redis-shake && gofmt -l .)"

      - name: Test
        run: cd workers/redis-shake && go test -race ./...

      - name: Build image
        run: docker build -t plugin-migrations-redis-shake:ci workers/redis-shake

  # ──────────────────────────────────────────────────────────────────────────
  # Helm: lint
  # ──────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.14.0"

      - run: helm lint charts/plugin-migrations/
