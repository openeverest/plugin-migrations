# OpenEverest MariaDB target (provider-mariadb 0.2.2+, Galera). The admin
# connection details point at the <name>-primary Service; the migration
# worker pins replication to the node behind it.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: orders-mariadb
  namespace: shop
spec:
  providerRef:
    name: mariadb
  topology:
    type: galera
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        requests: {cpu: 100m, memory: 384Mi}
        limits: {cpu: "1", memory: 768Mi}
      storage:
        size: 2Gi
      parameters:
        configuration: |
          [mariadb]
          innodb_buffer_pool_size=128M
