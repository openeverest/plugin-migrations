apiVersion: v1
kind: Service
metadata:
  name: {{ include "plugin-migrations.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "plugin-migrations.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "plugin-migrations.selectorLabels" . | nindent 4 }}
