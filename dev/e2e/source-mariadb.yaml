# OpenEverest MariaDB source (provider-mariadb, standalone). Standalone
# instances have no binary log and use server_id=1, like the target; a source
# needs a row-based binary log and its own server_id.
apiVersion: v1
kind: Namespace
metadata:
  name: legacy
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: legacy-mariadb
  namespace: legacy
spec:
  providerRef:
    name: mariadb
  topology:
    type: standalone
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        requests: {cpu: 100m, memory: 384Mi}
        limits: {cpu: "1", memory: 768Mi}
      storage:
        size: 2Gi
      parameters:
        configuration: |
          [mariadb]
          log_bin
          binlog_format=ROW
          server_id=2
          innodb_buffer_pool_size=128M
