# Slim values for the local k3d end-to-end test.
image:
  repository: plugin-migrations
  tag: e2e
  pullPolicy: Never
reconcileInterval: 3s
worker:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
engines:
  postgres-logical:
    image:
      repository: plugin-migrations-postgres-logical
      tag: e2e
      pullPolicy: Never
  mysql-replication:
    image:
      repository: plugin-migrations-mysql-replication
      tag: e2e
      pullPolicy: Never
  mariadb-replication:
    image:
      repository: plugin-migrations-mysql-replication
      tag: e2e
      pullPolicy: Never
  redis-shake:
    image:
      repository: plugin-migrations-redis-shake
      tag: e2e
      pullPolicy: Never
  mssql-log-shipping:
    image:
      repository: plugin-migrations-mssql-log-shipping
      tag: e2e
      pullPolicy: Never
